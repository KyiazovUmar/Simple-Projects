<!DOCTYPE html>
<html lang="en" class="h-full overflow-hidden select-none">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Digital Whiteboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    backgroundImage: {
                        'dot-grid': 'radial-gradient(circle, rgb(203,213,225) 1.2px, transparent 1.2px)',
                    }
                }
            }
        }
    </script>
</head>
<body class="h-full w-full bg-slate-50 bg-[length:20px_20px] bg-dot-grid font-sans antialiased relative overflow-hidden">

    <main id="viewport" class="absolute inset-0 z-0 cursor-grab active:cursor-grabbing overflow-hidden">
        <div id="canvas-stage" class="absolute inset-0 origin-top-left">
            <canvas id="drawing-canvas" class="absolute inset-0 pointer-events-none z-0"></canvas>
            <div id="elements-layer" class="absolute inset-0 z-10 pointer-events-none"></div>
        </div>
    </main>

    <header class="absolute top-4 left-4 right-4 z-30 flex items-center justify-between pointer-events-none">
        <div class="pointer-events-auto flex items-center gap-2.5 bg-white/80 backdrop-blur-md px-3.5 py-2 rounded-xl border border-slate-200/80 shadow-sm">
            <div class="w-6 h-6 bg-indigo-600 rounded-md text-white font-bold text-xs flex items-center justify-center">
                W
            </div>
            <input type="text" id="project-title" value="Untitled Board" class="bg-transparent text-slate-800 font-semibold text-sm px-1.5 py-0.5 rounded focus:bg-white focus:outline-none focus:ring-1 focus:ring-indigo-500 w-40 transition-all" />
        </div>

        <div class="pointer-events-auto flex items-center gap-2">
            <button id="share-btn" class="bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white text-xs font-semibold px-3.5 py-2 rounded-xl shadow-sm transition-all flex items-center gap-1.5 cursor-pointer">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M8.684 13.342C8.886 12.938 9 12.482 9 12c0-.482-.114-.938-.316-1.342m0 2.684a3 3 0 110-2.684m0 2.684l6.632 3.316m-6.632-6l6.632-3.316m0 0a3 3 0 105.367-2.684 3 3 0 00-5.367 2.684zm0 9.316a3 3 0 105.368 2.684 3 3 0 00-5.368-2.684z"></path></svg>
                Share
            </button>
        </div>
    </header>

    <nav class="absolute bottom-6 left-1/2 -translate-x-1/2 z-30 flex items-center gap-1 bg-white/90 backdrop-blur-md p-1.5 rounded-2xl border border-slate-200/80 shadow-lg">
        <button data-tool="select" class="tool-btn p-2.5 text-slate-600 hover:bg-slate-100 hover:text-slate-900 rounded-xl transition-all cursor-pointer" title="Pan / Select">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5"></path></svg>
        </button>

        <button data-tool="pen" class="tool-btn p-2.5 text-slate-600 hover:bg-slate-100 hover:text-slate-900 rounded-xl transition-all cursor-pointer" title="Pen">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg>
        </button>

        <button data-tool="sticky" class="tool-btn p-2.5 text-slate-600 hover:bg-slate-100 hover:text-slate-900 rounded-xl transition-all cursor-pointer" title="Sticky Note">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 11V9a2 2 0 012-2m0 0V5a2 2 0 012-2h6a2 2 0 012 2v2M7 7h10"></path></svg>
        </button>

        <button data-tool="text" class="tool-btn p-2.5 text-slate-600 hover:bg-slate-100 hover:text-slate-900 rounded-xl transition-all cursor-pointer" title="Text">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h8m-8 6h12"></path></svg>
        </button>

        <div class="h-5 w-[1px] bg-slate-200 mx-1"></div>

        <button id="clear-btn" class="p-2.5 text-slate-400 hover:bg-rose-50 hover:text-rose-600 rounded-xl transition-all cursor-pointer" title="Clear Canvas">
            <svg class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
        </button>
    </nav>

    <div id="toast-container" class="absolute bottom-20 right-6 z-40 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            let currentTool = 'select';
            let isDrawing = false;
            let isPanning = false;
            let panX = 0, panY = 0;
            let startX = 0, startY = 0;

            const viewport = document.getElementById('viewport');
            const stage = document.getElementById('canvas-stage');
            const canvas = document.getElementById('drawing-canvas');
            const ctx = canvas.getContext('2d');
            const elementsLayer = document.getElementById('elements-layer');
            const toolButtons = document.querySelectorAll('.tool-btn');
            const clearBtn = document.getElementById('clear-btn');
            const shareBtn = document.getElementById('share-btn');

            function initCanvas() {
                canvas.width = window.innerWidth * 3;
                canvas.height = window.innerHeight * 3;
                canvas.style.left = `-${window.innerWidth}px`;
                canvas.style.top = `-${window.innerHeight}px`;
            }
            window.addEventListener('resize', initCanvas);
            initCanvas();

            function setTool(toolName) {
                currentTool = toolName;
                toolButtons.forEach(btn => {
                    const isActive = btn.dataset.tool === toolName;
                    btn.classList.toggle('bg-slate-900', isActive);
                    btn.classList.toggle('text-white', isActive);
                    btn.classList.toggle('text-slate-600', !isActive);
                });

                viewport.className = 'absolute inset-0 z-0 overflow-hidden ';
                if (currentTool === 'pen') {
                    viewport.classList.add('cursor-crosshair');
                } else if (currentTool === 'select') {
                    viewport.classList.add('cursor-grab');
                } else {
                    viewport.classList.add('cursor-pointer');
                }
            }

            toolButtons.forEach(btn => {
                btn.addEventListener('click', () => setTool(btn.dataset.tool));
            });
            setTool('select');

            viewport.addEventListener('mousedown', (e) => {
                if (e.target !== viewport && e.target !== stage) return;

                const stageX = e.clientX - panX;
                const stageY = e.clientY - panY;

                if (currentTool === 'select') {
                    isPanning = true;
                    startX = e.clientX - panX;
                    startY = e.clientY - panY;
                } else if (currentTool === 'pen') {
                    isDrawing = true;
                    ctx.beginPath();
                    const canvasX = stageX + window.innerWidth;
                    const canvasY = stageY + window.innerHeight;
                    ctx.moveTo(canvasX, canvasY);
                    ctx.strokeStyle = 'rgb(15, 23, 42)';
                    ctx.lineWidth = 2.5;
                    ctx.lineCap = 'round';
                    ctx.lineJoin = 'round';
                } else if (currentTool === 'sticky') {
                    createStickyNote(stageX, stageY);
                } else if (currentTool === 'text') {
                    createTextElement(stageX, stageY);
                }
            });

            window.addEventListener('mousemove', (e) => {
                if (isPanning) {
                    panX = e.clientX - startX;
                    panY = e.clientY - startY;
                    stage.style.transform = `translate(${panX}px, ${panY}px)`;
                } else if (isDrawing && currentTool === 'pen') {
                    const stageX = e.clientX - panX;
                    const stageY = e.clientY - panY;
                    const canvasX = stageX + window.innerWidth;
                    const canvasY = stageY + window.innerHeight;
                    ctx.lineTo(canvasX, canvasY);
                    ctx.stroke();
                }
            });

            window.addEventListener('mouseup', () => {
                isPanning = false;
                if (isDrawing) {
                    isDrawing = false;
                    ctx.closePath();
                }
            });

            function createStickyNote(x, y) {
                const note = document.createElement('div');
                note.className = 'absolute pointer-events-auto p-3.5 w-44 h-44 bg-amber-100 text-amber-950 border border-amber-200 shadow-md rounded-xl flex flex-col justify-between group cursor-move';
                note.style.left = `${x}px`;
                note.style.top = `${y}px`;

                note.innerHTML = `
                    <textarea placeholder="Write note..." class="w-full h-full bg-transparent resize-none focus:outline-none text-sm font-medium leading-snug placeholder-amber-800/40"></textarea>
                    <div class="flex items-center justify-between opacity-0 group-hover:opacity-100 transition-opacity pt-1">
                        <div class="flex gap-1">
                            <button data-bg="bg-amber-100 border-amber-200 text-amber-950" class="color-picker-dot w-3.5 h-3.5 rounded-full bg-amber-200 border border-amber-400"></button>
                            <button data-bg="bg-sky-100 border-sky-200 text-sky-950" class="color-picker-dot w-3.5 h-3.5 rounded-full bg-sky-200 border border-sky-400"></button>
                            <button data-bg="bg-emerald-100 border-emerald-200 text-emerald-950" class="color-picker-dot w-3.5 h-3.5 rounded-full bg-emerald-200 border border-emerald-400"></button>
                            <button data-bg="bg-rose-100 border-rose-200 text-rose-950" class="color-picker-dot w-3.5 h-3.5 rounded-full bg-rose-200 border border-rose-400"></button>
                        </div>
                        <button class="delete-btn text-xs opacity-60 hover:opacity-100 font-bold px-1">&times;</button>
                    </div>
                `;

                note.querySelectorAll('.color-picker-dot').forEach(dot => {
                    dot.addEventListener('click', (e) => {
                        e.stopPropagation();
                        note.className = `absolute pointer-events-auto p-3.5 w-44 h-44 ${dot.dataset.bg} border shadow-md rounded-xl flex flex-col justify-between group cursor-move`;
                    });
                });

                makeDraggable(note);
                elementsLayer.appendChild(note);
                note.querySelector('textarea').focus();
            }

            function createTextElement(x, y) {
                const wrapper = document.createElement('div');
                wrapper.className = 'absolute pointer-events-auto group cursor-move';
                wrapper.style.left = `${x}px`;
                wrapper.style.top = `${y}px`;

                wrapper.innerHTML = `
                    <div class="flex items-center gap-1">
                        <input type="text" placeholder="Type text..." class="bg-transparent text-slate-800 font-semibold text-base px-1.5 py-0.5 border border-transparent hover:border-slate-300 focus:border-indigo-500 focus:bg-white rounded outline-none" autofocus />
                        <button class="delete-btn opacity-0 group-hover:opacity-100 text-slate-400 hover:text-rose-500 text-xs font-bold px-1 transition-opacity">&times;</button>
                    </div>
                `;

                makeDraggable(wrapper);
                elementsLayer.appendChild(wrapper);
                wrapper.querySelector('input').focus();
            }

            function makeDraggable(element) {
                let dragStartX = 0, dragStartY = 0;
                let elemStartX = 0, elemStartY = 0;
                let isDragging = false;

                element.addEventListener('mousedown', (e) => {
                    if (['INPUT', 'TEXTAREA', 'BUTTON'].includes(e.target.tagName)) return;
                    isDragging = true;
                    dragStartX = e.clientX;
                    dragStartY = e.clientY;
                    elemStartX = parseFloat(element.style.left);
                    elemStartY = parseFloat(element.style.top);
                    element.style.zIndex = 50;
                });

                window.addEventListener('mousemove', (e) => {
                    if (!isDragging) return;
                    const deltaX = e.clientX - dragStartX;
                    const deltaY = e.clientY - dragStartY;
                    element.style.left = `${elemStartX + deltaX}px`;
                    element.style.top = `${elemStartY + deltaY}px`;
                });

                window.addEventListener('mouseup', () => {
                    if (isDragging) {
                        isDragging = false;
                        element.style.zIndex = 10;
                    }
                });

                element.addEventListener('click', (e) => {
                    if (e.target.classList.contains('delete-btn')) {
                        element.remove();
                    }
                });
            }

            clearBtn.addEventListener('click', () => {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                elementsLayer.innerHTML = '';
                showToast('Board cleared');
            });

            shareBtn.addEventListener('click', () => {
                navigator.clipboard?.writeText(window.location.href);
                showToast('Link copied to clipboard');
            });

            function showToast(message) {
                const container = document.getElementById('toast-container');
                const toast = document.createElement('div');
                toast.className = 'bg-slate-900/90 text-white text-xs px-3.5 py-2 rounded-lg shadow-md backdrop-blur-md transition-all duration-200 translate-y-2 opacity-0 flex items-center gap-2';
                toast.innerHTML = `<span class="w-1.5 h-1.5 rounded-full bg-indigo-400"></span>${message}`;

                container.appendChild(toast);
                requestAnimationFrame(() => toast.classList.remove('translate-y-2', 'opacity-0'));

                setTimeout(() => {
                    toast.classList.add('opacity-0');
                    setTimeout(() => toast.remove(), 200);
                }, 2000);
            }
        });
    </script>
</body>
</html>
